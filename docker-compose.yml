version: "3.9"

services:
  emergent:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: emergent-dev
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
    command: ["npm", "run", "dev", "--", "--host"]
    restart: unless-stopped
